[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # proc-macro-error is unmaintained. Only tray-icon's Linux backend (gtk 0.18) uses
    # it; the macOS build never compiles it, and tray-icon 0.26.1 is the latest.
    { id = "RUSTSEC-2024-0370", reason = "Linux-only, via tray-icon -> gtk 0.18; no upstream fix" },
    # zbus's zvariant family is unmaintained. Only eframe's Linux accessibility backend
    # (accesskit_unix, AT-SPI over D-Bus) uses it; the macOS build never compiles it.
    { id = "RUSTSEC-2026-0370", reason = "Linux-only, via eframe -> accesskit_unix; no upstream fix" },
    { id = "RUSTSEC-2026-0371", reason = "Linux-only, via eframe -> accesskit_unix; no upstream fix" },
    { id = "RUSTSEC-2026-0372", reason = "Linux-only, via eframe -> accesskit_unix; no upstream fix" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
